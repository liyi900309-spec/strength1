    introChips.appendChild(chip);
  });

  // ---------- segments ----------
  pages.forEach(function () {
    var seg = document.createElement("div");
    seg.className = "seg";
    var fill = document.createElement("i");
    seg.appendChild(fill);
    segsEl.appendChild(seg);
  });

  function updateProgress() {
    var answered = Object.keys(answers).length;
    progressCountEl.textContent = answered + " / " + totalItems;
    pages.forEach(function (p, i) {
      var segFill = segsEl.children[i].firstChild;
      segFill.style.setProperty("--seg-color", p.virtue.color);
      var total = p.strengths.length * 3;
      var done = 0;
      p.strengths.forEach(function (s) {
        for (var k = 0; k < 3; k++) if (answers[s.id + "-" + k] != null) done++;
      });
      var pct = i < pageIndex ? 100 : (i === pageIndex ? (done / total) * 100 : (i < pageIndex ? 100 : 0));
      segFill.style.width = pct + "%";
    });
  }

  // ---------- render quiz page ----------
  function renderPage() {
    var page = pages[pageIndex];
    var v = page.virtue;

    quizVirtueHead.innerHTML =
      '<div class="tag" style="--v-color:' + v.color + '"><i></i>第 ' + (pageIndex + 1) + ' / ' + pages.length + ' 部分</div>' +
      '<h2 class="serif">' + v.name + '</h2>' +
      '<p>' + v.desc + '</p>';

    quizItems.innerHTML = "";
    page.strengths.forEach(function (s) {
      var block = document.createElement("div");
      block.className = "strength-block";
      var label = document.createElement("p");
      label.className = "strength-name";
      label.textContent = s.name;
      block.appendChild(label);

      s.items.forEach(function (text, idx) {
        var key = s.id + "-" + idx;
        var item = document.createElement("div");
        item.className = "item";

        var p = document.createElement("p");
        p.textContent = text;
        item.appendChild(p);

        var scale = document.createElement("div");
        scale.className = "scale";
        scale.style.setProperty("--v-color", v.color);
        for (var val = 1; val <= 5; val++) {
          (function (val) {
            var b = document.createElement("button");
            b.type = "button";
            b.textContent = val;
            if (answers[key] === val) b.classList.add("sel");
            b.addEventListener("click", function () {
              answers[key] = val;
              var sibs = scale.querySelectorAll("button");
              for (var i = 0; i < sibs.length; i++) sibs[i].classList.remove("sel");
              b.classList.add("sel");
              missingHint.textContent = "";
              updateProgress();
            });
            scale.appendChild(b);
          })(val);
        }
        item.appendChild(scale);

        var labels = document.createElement("div");
        labels.className = "scale-labels";
        labels.innerHTML = "<span>完全不符合</span><span>完全符合</span>";
        item.appendChild(labels);

        block.appendChild(item);
      });

      quizItems.appendChild(block);
    });

    prevBtn.disabled = pageIndex === 0;
    nextBtn.textContent = pageIndex === pages.length - 1 ? "查看结果" : "下一步";
    missingHint.textContent = "";
    updateProgress();
  }

  function pageComplete(i) {
    var page = pages[i];
    for (var si = 0; si < page.strengths.length; si++) {
      for (var k = 0; k < 3; k++) {
        if (answers[page.strengths[si].id + "-" + k] == null) return false;
      }
    }
    return true;
  }

  document.getElementById("startBtn").addEventListener("click", function () {
    pageIndex = 0;
    renderPage();
    showScreen("quiz");
  });

  prevBtn.addEventListener("click", function () {
    if (pageIndex === 0) return;
    pageIndex--;
    renderPage();
  });

  nextBtn.addEventListener("click", function () {
    if (!pageComplete(pageIndex)) {
      missingHint.textContent = "请先回答完这一部分的所有题目，再继续。";
      return;
    }
    if (pageIndex < pages.length - 1) {
      pageIndex++;
      renderPage();
    } else {
      computeAndShowResults();
    }
  });

  // ---------- results ----------
  function computeAndShowResults() {
    var strengthScores = STRENGTHS.map(function (s) {
      var sum = 0;
      for (var k = 0; k < 3; k++) sum += answers[s.id + "-" + k];
      return { strength: s, score: sum / 3 };
    });

    var virtueScores = VIRTUES.map(function (v) {
      var members = strengthScores.filter(function (r) { return r.strength.virtue === v.id; });
      var sum = members.reduce(function (a, r) { return a + r.score; }, 0);
      return { virtue: v, score: sum / members.length };
    });

    var ranked = strengthScores.slice().sort(function (a, b) { return b.score - a.score; });

    // hero
    var top = ranked[0];
    document.getElementById("topStrengthName").textContent = top.strength.name;
    document.getElementById("topStrengthDesc").textContent =
      "你最突出的标志性优势，隶属于「" + virtueById[top.strength.virtue].name + "」这一美德。";

    // radar
    drawRadar(virtueScores);

    // virtue summary
    var vsWrap = document.getElementById("virtueSummary");
    vsWrap.innerHTML = "";
    virtueScores.slice().sort(function (a,b){ return b.score - a.score; }).forEach(function (r) {
      var row = document.createElement("div");
      row.className = "vs-row";
      row.innerHTML =
        '<div class="vs-top">' +
          '<span class="vs-name"><i style="background:' + r.virtue.color + '"></i>' + r.virtue.name + '</span>' +
          '<span class="vs-score">' + r.score.toFixed(1) + ' / 5</span>' +
        '</div>' +
        '<div class="vs-desc">' + r.virtue.desc + '</div>';
      vsWrap.appendChild(row);
    });

    // rank list
    var rankWrap = document.getElementById("rankRows");
    rankWrap.innerHTML = "";
    ranked.forEach(function (r, i) {
      var v = virtueById[r.strength.virtue];
      var row = document.createElement("div");
      row.className = "rank-row";
      row.innerHTML =
        '<span class="rank-num">' + (i + 1) + '</span>' +
        '<div class="rank-main">' +
          '<div class="rank-top-line">' +
            '<span class="rank-name">' + r.strength.name + '</span>' +
            (i < 5 ? '<span class="rank-badge">标志性</span>' : '') +
          '</div>' +
          '<div class="rank-bar-track"><div class="rank-bar-fill" style="--bar-color:' + v.color + ';width:' + (r.score/5*100) + '%"></div></div>' +
        '</div>' +
        '<span class="rank-score">' + r.score.toFixed(1) + '</span>';
      rankWrap.appendChild(row);
    });

    // share url
    var shareUrlEl = document.getElementById("shareUrl");
    shareUrlEl.textContent = PUBLIC_URL;

    showScreen("results");
  }

  function drawRadar(virtueScores) {
    var svg = document.getElementById("radarSvg");
    var ns = "http://www.w3.org/2000/svg";
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    var cx = 170, cy = 170, maxR = 118;
    var n = virtueScores.length;
    var angleFor = function (i) { return -Math.PI / 2 + (i * 2 * Math.PI / n); };
    var pointFor = function (i, r) {
      var a = angleFor(i);
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    };

    function el(tag, attrs) {
      var e = document.createElementNS(ns, tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

    // grid rings at score 1..5
    for (var ring = 1; ring <= 5; ring++) {
      var r = maxR * (ring / 5);
      var pts = [];
      for (var i = 0; i < n; i++) pts.push(pointFor(i, r).join(","));
      svg.appendChild(el("polygon", {
        points: pts.join(" "),
        fill: "none",
        stroke: "var(--line)",
        "stroke-width": ring === 5 ? 1.2 : 0.8
      }));
    }

    // axes
    for (i = 0; i < n; i++) {
      var p = pointFor(i, maxR);
      svg.appendChild(el("line", { x1: cx, y1: cy, x2: p[0], y2: p[1], stroke: "var(--line)", "stroke-width": 0.8 }));
    }

    // data polygon
    var dataPts = virtueScores.map(function (r, i) { return pointFor(i, (r.score / 5) * maxR); });
    svg.appendChild(el("polygon", {
      points: dataPts.map(function (p) { return p.join(","); }).join(" "),
      fill: "var(--accent)",
      "fill-opacity": "0.28",
      stroke: "var(--accent)",
      "stroke-width": 2,
      "stroke-linejoin": "round"
    }));

    // vertex dots
    virtueScores.forEach(function (r, i) {
      var p = dataPts[i];
      svg.appendChild(el("circle", { cx: p[0], cy: p[1], r: 4.5, fill: r.virtue.color }));
    });

    // labels
    virtueScores.forEach(function (r, i) {
      var lp = pointFor(i, maxR + 30);
      var t = el("text", {
        x: lp[0], y: lp[1],
        "text-anchor": Math.abs(lp[0] - cx) < 4 ? "middle" : (lp[0] > cx ? "start" : "end"),
        "dominant-baseline": Math.abs(lp[1] - cy) < 4 ? "middle" : (lp[1] > cy ? "hanging" : "auto"),
        fill: r.virtue.color,
        "font-size": "12.5",
        "font-family": "-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
      });
      t.textContent = r.virtue.name;
      svg.appendChild(t);

      var t2 = el("text", {
        x: lp[0], y: lp[1] + (lp[1] > cy ? 15 : (Math.abs(lp[1]-cy) < 4 ? 15 : -15)),
        "text-anchor": t.getAttribute("text-anchor"),
        fill: "var(--ink-soft)",
        "font-size": "11"
      });
      t2.textContent = r.score.toFixed(1);
      svg.appendChild(t2);
    });
  }

  // ---------- share / retake ----------
  document.getElementById("copyBtn").addEventListener("click", function () {
    var url = PUBLIC_URL;
    var btn = this;
    function done(ok) {
      btn.textContent = ok ? "已复制链接" : "复制失败，请手动复制";
      setTimeout(function () { btn.textContent = "复制链接"; }, 1800);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { done(true); }).catch(function () { done(false); });
    } else {
      try {
        var ta = document.createElement("textarea");
        ta.value = url;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done(true);
      } catch (e) { done(false); }
    }
  });

  document.getElementById("retakeBtn").addEventListener("click", function () {
    answers = {};
    pageIndex = 0;
    renderPage();
    showScreen("intro");
  });

})();
</script>
</body>
</html>
